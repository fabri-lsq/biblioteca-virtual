<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Fabricio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
.wrapper{width:100%;height:100vh;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;position:relative}
.panel{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:filter 0.35s ease;text-decoration:none}
.panel-vinyl{background:#1a1a2e}
.panel-book {background:#1e2d1e}
.panel-manga{background:#2d1e1e}
.panel-game {background:#1e1e2d}
.wrapper:has(.panel:hover) .panel{filter:brightness(0.2)}
.wrapper:has(.panel:hover) .panel:hover{filter:brightness(1)}
.icon-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform 0.35s ease}
.panel:hover .icon-wrap{transform:scale(1.08)}
.icon-svg{width:88px;height:88px;opacity:0.85}
.label{font-family:system-ui,sans-serif;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.45);font-weight:400;transition:color 0.35s}
.panel:hover .label{color:rgba(255,255,255,0.9)}
.divider-h{position:absolute;top:50%;left:0;width:100%;height:1px;background:rgba(255,255,255,0.07);z-index:5;pointer-events:none}
.divider-v{position:absolute;top:0;left:50%;width:1px;height:100%;background:rgba(255,255,255,0.07);z-index:5;pointer-events:none}
.center-title{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:20;pointer-events:none;text-align:center;
}
.center-title h1{
  font-family:system-ui,sans-serif;
  font-size:clamp(1.8rem,3.5vw,3rem);
  font-weight:600;
  color:rgba(255,255,255,0.95);
  letter-spacing:0.14em;
  text-transform:uppercase;
  line-height:1.15;
  text-shadow:0 2px 24px rgba(0,0,0,0.8),0 0 60px rgba(0,0,0,0.6);
}
.center-title p{
  font-size:clamp(0.6rem,1vw,0.75rem);
  color:rgba(255,255,255,0.3);
  letter-spacing:0.25em;
  text-transform:uppercase;
  margin-top:8px;
  text-shadow:0 1px 8px rgba(0,0,0,0.8);
}
@media(max-width:500px){
  .icon-svg{width:60px;height:60px}
  .label{font-size:11px}
}
</style>
</head>
<body>

<div class="wrapper">
  <div class="divider-h"></div>
  <div class="divider-v"></div>

  <a class="panel panel-vinyl" href="/WebVinilos/index.html">
    <div class="icon-wrap">
      <svg class="icon-svg" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <circle cx="36" cy="36" r="34" fill="#e8d5b0" opacity="0.08"/>
        <circle cx="36" cy="36" r="34" stroke="#e8d5b0" stroke-width="1" opacity="0.3"/>
        <circle cx="36" cy="36" r="28" stroke="#e8d5b0" stroke-width="0.5" opacity="0.2"/>
        <circle cx="36" cy="36" r="22" stroke="#e8d5b0" stroke-width="0.5" opacity="0.2"/>
        <circle cx="36" cy="36" r="16" stroke="#e8d5b0" stroke-width="0.5" opacity="0.2"/>
        <circle cx="36" cy="36" r="10" stroke="#e8d5b0" stroke-width="0.5" opacity="0.2"/>
        <circle cx="36" cy="36" r="4" fill="#e8d5b0" opacity="0.6"/>
        <circle cx="36" cy="36" r="2" fill="#1a1a2e"/>
        <path d="M36 4 A32 32 0 0 1 68 36" stroke="#e8d5b0" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
        <path d="M36 4 A32 32 0 0 0 4 36" stroke="#c4a882" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
      </svg>
      <span class="label">Vinilos</span>
    </div>
  </a>

  <a class="panel panel-book" href="/WebLibros/index.html">
    <div class="icon-wrap">
      <svg class="icon-svg" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <rect x="14" y="12" width="34" height="52" rx="3" fill="#1e2d1e" stroke="#a8d5a2" stroke-width="0.8" opacity="0.3"/>
        <rect x="16" y="14" width="30" height="48" rx="2" fill="#a8d5a2" opacity="0.08"/>
        <line x1="22" y1="26" x2="40" y2="26" stroke="#a8d5a2" stroke-width="1" opacity="0.5"/>
        <line x1="22" y1="32" x2="40" y2="32" stroke="#a8d5a2" stroke-width="1" opacity="0.3"/>
        <line x1="22" y1="38" x2="36" y2="38" stroke="#a8d5a2" stroke-width="1" opacity="0.3"/>
        <rect x="14" y="12" width="4" height="52" rx="2" fill="#a8d5a2" opacity="0.25"/>
      </svg>
      <span class="label">Libros</span>
    </div>
  </a>

  <a class="panel panel-manga" href="/WebManga/index.html">
    <div class="icon-wrap">
      <svg class="icon-svg" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <rect x="10" y="8" width="22" height="56" rx="2" fill="#f4a0a0" opacity="0.1" stroke="#f4a0a0" stroke-width="0.8" opacity="0.35"/>
        <rect x="18" y="10" width="22" height="56" rx="2" fill="#2d1e1e" stroke="#f4a0a0" stroke-width="0.8" opacity="0.3"/>
        <rect x="26" y="12" width="22" height="56" rx="2" fill="#f4a0a0" opacity="0.08" stroke="#f4a0a0" stroke-width="1" opacity="0.4"/>
        <rect x="26" y="12" width="4" height="56" rx="2" fill="#f4a0a0" opacity="0.2"/>
        <line x1="33" y1="22" x2="44" y2="22" stroke="#f4a0a0" stroke-width="1" opacity="0.4"/>
        <line x1="33" y1="28" x2="44" y2="28" stroke="#f4a0a0" stroke-width="1" opacity="0.25"/>
        <line x1="33" y1="34" x2="42" y2="34" stroke="#f4a0a0" stroke-width="1" opacity="0.25"/>
      </svg>
      <span class="label">Mangas</span>
    </div>
  </a>

  <a class="panel panel-game" href="/WebJuegos/index.html">
    <div class="icon-wrap">
      <svg class="icon-svg" viewBox="0 0 72 72" fill="none" aria-hidden="true">
        <rect x="18" y="16" width="36" height="46" rx="4" fill="#a0b4f4" opacity="0.1" stroke="#a0b4f4" stroke-width="1" opacity="0.4"/>
        <rect x="21" y="10" width="30" height="6" rx="2" fill="#a0b4f4" opacity="0.3"/>
        <line x1="36" y1="28" x2="36" y2="40" stroke="#a0b4f4" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <line x1="30" y1="34" x2="42" y2="34" stroke="#a0b4f4" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
        <circle cx="46" cy="30" r="2" fill="#a0b4f4" opacity="0.6"/>
        <circle cx="52" cy="36" r="2" fill="#a0b4f4" opacity="0.4"/>
        <circle cx="46" cy="42" r="2" fill="#a0b4f4" opacity="0.4"/>
      </svg>
      <span class="label">Juegos</span>
    </div>
  </a>

  <div class="center-title">
    <h1>Biblioteca<br>Fabricio</h1>
    <p>colección personal</p>
  </div>
</div>

</body>
</html>
